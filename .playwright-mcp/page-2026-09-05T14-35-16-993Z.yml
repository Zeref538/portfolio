            - list [ref=e749]:
              - listitem [ref=e750]: "▸ Built the dataset the model learns from: PAGASA keeps no archive, so a twice-daily collector commits every reading and the scrape runs before the model — a modelling bug can never cost an observation that cannot be re-fetched"
              - listitem [ref=e751]: ▸ Split the calendar before searching 3,776 configurations, so the winner was ranked on dates it could see and scored once on dates it could not; dev 0.615 → holdout 0.617 mean ratio is what makes the 7/7 result credible rather than a search reporting its own luck
              - listitem [ref=e752]: "▸ The win came from pooling, not from a fancier estimator: one model per (dam, horizon) starved each of 63 models on 13–94 rows, and pooling every dam and horizon into a single Mondrian forest turned that into ~1,750 — with per-dam target scaling, since the dams differ in movement by 12×"
