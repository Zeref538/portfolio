            - paragraph [ref=e729]: "Forecasts reservoir water level 1–7 days ahead for the nine major Luzon dams and turns it into plain-language spill risk. PAGASA publishes a daily dam bulletin and keeps no archive — the page shows today and yesterday, then the reading is gone — so the project starts by building the dataset it learns from: a twice-daily collector, seeded from 166 Wayback snapshots, that commits every reading before the model runs. The model is online, not batch: one pooled River Mondrian forest updated with learn_one as each label arrives, scored prequentially against persistence and drift baselines. Choosing it was the interesting part. A search over 3,776 configurations will find something that beats the baselines on the dates you already have, so the calendar was split before the search ran — ranking reads only dates before 2025-11-01 and the holdout was scored exactly once. It slipped 0.002 (dev 0.615 to holdout 0.617 mean ratio) and beat both baselines at all seven horizons. The real finding was about data rather than algorithms: one model per dam per horizon gave each of 63 models 13–94 rows to fit 15 coefficients, and pooling them into one turned that into ~1,750."
