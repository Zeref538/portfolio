            - paragraph: "Point it at a folder of receipts and it reads each one, checks that the numbers actually add up, and writes a row to your ledger — quietly. Only the ones that fail their own arithmetic reach you. The idea it is built on is that asking a model how confident it is tells you nothing: it will state a wrong total with total conviction. So TAB never asks. It re-adds the receipt instead — line items against the subtotal, subtotal plus VAT against the printed total, VAT against 12% of VATable sales — and a receipt that disagrees with itself was misread, which you know without any model being involved. Measured on 100 photographed receipts with a free local model: 89 of 100 totals read correctly, and the arithmetic alone caught 10 of the 11 wrong ones. It is also a step other software can call: one HTTP endpoint takes a receipt and returns a verdict to branch on, with an importable n8n workflow that files the ones that reconcile to a spreadsheet and sends the rest to a person with the disputed line named. Everything runs on your own machine and the review screen binds to localhost only, because receipts are personal data and there is nowhere for them to go."
            - generic [ref=e631]: // impact
            - list [ref=e632]:
              - listitem [ref=e633]: "▸ The guard is arithmetic, not model confidence: re-adding each receipt caught 10 of the 11 wrong totals with no model asked how sure it felt — the check costs nothing to run and is what separates this from a wrapper around an OCR call"
              - listitem [ref=e634]: "▸ Reports four numbers together and leads with the ugly one: 30% straight-through, 1% silent error rate (committed and wrong), plus the admission that 25 correct receipts in 100 were escalated for nothing — a tool that over-escalates is annoying, one that writes a wrong total into your tax records is worse than no tool"
              - listitem [ref=e635]: "▸ Refuses to claim what it has not measured: the numbers come from Indonesian receipts (CORD test split), so no Philippine VAT or TIN accuracy is claimed until a local labelled set exists — the scope section says so on the page itself"
              - listitem [ref=e636]: "▸ Runs unattended and survives its own failures: batches resume from where they were killed, and if the model stops mid-run the receipts are left unmarked rather than recorded as failures, because a receipt nobody read is not a receipt that failed"
