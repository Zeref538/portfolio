              - listitem [ref=e754]: ▸ Caught a real data leak — PAGASA prints one 24-hour deviation per snapshot against both the today and yesterday rows, so on the older row it is the future change; taken at face value a naive baseline 'predicts' tomorrow to 0.05 m. Recomputed from our own series and pinned by a regression test
