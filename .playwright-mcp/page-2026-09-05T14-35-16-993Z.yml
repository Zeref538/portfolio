            - heading "LiitLLM — A Taglish LLM From Scratch" [level=3] [ref=e270]
            - generic [ref=e271]: From Scratch · Transformers · Ablation Design
            - paragraph [ref=e272]: "Built a 32.8M-parameter language model from scratch in pure PyTorch and trained it on Taglish — the Tagalog-English code-switched register Filipinos actually write in — on a thesis that inverts standard practice: every large web corpus is sorted by a language-ID filter that scores code-switched text as low-confidence noise and discards it, so I wrote a filter that keeps only that text. The result is a controlled experiment rather than a demo: two arms, two seeds each, identical architecture, identical 995,000,000-token budget and a shared tokenizer trained on the unfiltered side so neither arm gets an advantage, with the code-switch filter as the only difference. The filtered models emit three times as much English as the controls — a gap 2.8x the widest spread between seeds of the same arm, with no overlap. The finding I did not want is in the writeup too: measured on 50,000 documents per source, Filipino web text is already 38-40% code-switched, which weakens my own control arm and shrinks the claim from 'filtering creates code-switching' to 'filtering the rest of the way still measurably changes the model'."
