              - listitem [ref=e638]: "▸ Three readers measured on the same 100 receipts before picking one, and the biggest model lost: the 7B files 52 of 100 unattended against the 3B's 30, but 15 of those carry a wrong field against 8 — the same error rate on twice the volume, for double the time. An OCR engine is wrong least of all (2 in 100) because it can only report characters it actually saw, and worst at deciding which number is the total"
              - listitem [ref=e639]: "▸ Built the retry the plan called for, measured it, and deleted it: 67 second readings changed one verdict and cost 86% more time per checked receipt. The ADR recording why it was removed is worth more than the feature would have been"
              - listitem [ref=e640]: ▸ One HTTP endpoint makes it a step in someone else's pipeline rather than an app to sit in front of — the shipped n8n workflow was imported into a real n8n and executed against a running instance, taking the 'file it' branch on a receipt that reconciled and the 'ask a person' branch on one where line 3 read ₱80.00 where 3 × ₱30.00 is ₱90.00
