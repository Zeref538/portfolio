<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The search-result snippet. Google shows about 155 characters, so this one
         leads with what people search for; the share card below keeps the story. -->
    <meta name="description" content="John Andrei Martinez, AI/ML engineer and Computer Science student in Bulacan, Philippines. Projects in machine learning, RAG, LLMs built from scratch and data analytics." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="canonical" href="https://johnandrei.vercel.app/" />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="John Andrei Martinez" />
    <!-- proves to Google Search Console that this site is mine -->
    <meta name="google-site-verification" content="FrESwWtkHdo4gmUBoCgd4r4D0r2meeVI5_OSzEWHvYc" />
    <title>John Andrei Martinez - AI/ML Engineer</title>

    <!-- Share preview. Without these a pasted link in LinkedIn, Slack or a DM
         renders as a bare grey box with the URL, which reads as broken. og: is
         Open Graph, the format Facebook wrote and nearly everything else adopted;
         the twitter: tags are the one meaningful exception. Both need the image
         as a full absolute URL -- a relative path is silently ignored. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="John Andrei Martinez" />
    <meta property="og:url" content="https://johnandrei.vercel.app/" />
    <meta property="og:title" content="John Andrei Martinez - AI/ML Engineer" />
    <meta property="og:description" content="I judged my own model on clients it had never seen: Precision@50 of 0.88 against a 0.551 base rate, and it still could not be separated from the five-line rule I wrote first. I published the non-result instead of the flattering number." />
    <meta property="og:image" content="https://johnandrei.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="John Andrei Martinez, AI/ML Engineer" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="John Andrei Martinez - AI/ML Engineer" />
    <meta name="twitter:description" content="I judged my own model on clients it had never seen: Precision@50 of 0.88, and it still could not be separated from a five-line rule." />
    <meta name="twitter:image" content="https://johnandrei.vercel.app/og-image.png" />

    <!-- Structured data: tells Google this page is about a person, so a search
         for the name can show a richer result than a plain blue link. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "John Andrei Martinez",
        "url": "https://johnandrei.vercel.app/",
        "image": "https://johnandrei.vercel.app/john-andrei-martinez.jpg",
        "jobTitle": "AI/ML Engineer",
        "email": "mailto:martinezjandrei8425@gmail.com",
        "sameAs": [
          "https://github.com/Zeref538",
          "https://linkedin.com/in/john-andrei-martinez-499a0b343",
          "https://www.kaggle.com/johnandreimartinez"
        ],
        "address": { "@type": "PostalAddress", "addressLocality": "San Jose del Monte", "addressRegion": "Bulacan", "addressCountry": "PH" },
        "alumniOf": { "@type": "CollegeOrUniversity", "name": "Our Lady of Fatima University" },
        "knowsAbout": ["Machine Learning", "Data Analysis", "Computer Vision", "Retrieval-Augmented Generation", "Python", "PyTorch"]
      }
    </script>
    <!-- Loading screen. It lives here, not in React, so it paints before any
         script has downloaded. src/loader.js flies the name into the hero. -->
    <script>
      try { var t = localStorage.getItem("theme"); if (t === "light") document.documentElement.dataset.theme = "light"; } catch (e) {}
      document.documentElement.classList.add("loading");
    </script>
    <style>
      #loader { position: fixed; inset: 0; z-index: 9999; display: grid; place-content: center; justify-items: center; gap: 22px;
        background: #000; color: #fafaf9; font-family: "Schibsted Grotesk", system-ui, sans-serif; transition: background-color .5s ease; }
      [data-theme="light"] #loader { background: #f5f5f4; color: #1c1917; }
      #loader .ld-name { font-size: clamp(2.4rem, 6.5vw, 4.5rem); font-weight: 700; letter-spacing: -0.05em; white-space: nowrap; }
      #loader .ld-name span { display: inline-block; transform-origin: 0 0; will-change: transform; }
      #loader .ld-name span + span { margin-left: .25em; font-family: "Newsreader", Georgia, serif; font-style: italic; font-weight: 400; letter-spacing: -0.01em; color: #a78bfa; }
      [data-theme="light"] #loader .ld-name span + span { color: #6d28d9; }
      #loader .ld-bar { width: 160px; height: 2px; background: rgba(128,128,128,.25); border-radius: 2px; overflow: hidden; transition: opacity .3s; }
      #loader .ld-bar i { display: block; height: 100%; width: 100%; background: #a78bfa; transform-origin: left; transform: scaleX(0); animation: ld-fill 2.5s cubic-bezier(.1,.7,.3,1) forwards; }
      #loader.done .ld-bar i { animation: none; transform: scaleX(1); transition: transform .25s; }
      #loader.done .ld-bar { opacity: 0; }
      #loader .ld-cmd { font: 13px "JetBrains Mono Variable", ui-monospace, monospace; opacity: .6; transition: opacity .3s; }
      #loader.done .ld-cmd { opacity: 0; }
      #loader.gone { background-color: transparent; pointer-events: none; }
      @keyframes ld-fill { to { transform: scaleX(.85); } }
      @media (max-width: 680px) { #loader .ld-name { font-size: 44px; } }
    </style>
</head>
  <body>
    <div id="loader" aria-hidden="true">
      <div class="ld-name"><span>John Andrei</span><span>Martinez</span></div>
      <div class="ld-bar"><i></i></div>
      <div class="ld-cmd">zeref@portfolio:~$ booting</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
