<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The search-result snippet. Google shows about 155 characters, so this one
         leads with what people search for; the share card below keeps the story. -->

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="canonical" href="https://johnandrei.vercel.app/" />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="John Andrei Martinez" />
    <!-- proves to Google Search Console that this site is mine -->
    <meta name="google-site-verification" content="FrESwWtkHdo4gmUBoCgd4r4D0r2meeVI5_OSzEWHvYc" />
    <title>John Andrei Martinez - AI/ML Engineer</title>

    <!-- Share preview. Without these a pasted link in LinkedIn, Slack or a DM
         renders as a bare grey box with the URL, which reads as broken. og: is
         Open Graph, the format Facebook wrote and nearly everything else adopted;
         the twitter: tags are the one meaningful exception. Both need the image
         as a full absolute URL -- a relative path is silently ignored. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="John Andrei Martinez" />
    <meta property="og:url" content="https://johnandrei.vercel.app/" />
    <meta property="og:title" content="John Andrei Martinez - AI/ML Engineer" />
    <meta property="og:description" content="I judged my own model on clients it had never seen: Precision@50 of 0.88 against a 0.551 base rate, and it still could not be separated from the five-line rule I wrote first. I published the non-result instead of the flattering number." />
    <meta property="og:image" content="https://johnandrei.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="John Andrei Martinez, AI/ML Engineer" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="John Andrei Martinez - AI/ML Engineer" />
    <meta name="twitter:description" content="I judged my own model on clients it had never seen: Precision@50 of 0.88, and it still could not be separated from a five-line rule." />
    <meta name="twitter:image" content="https://johnandrei.vercel.app/og-image.png" />

    <!-- Structured data: tells Google this page is about a person, so a search
         for the name can show a richer result than a plain blue link. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "John Andrei Martinez",
        "url": "https://johnandrei.vercel.app/",
        "image": "https://johnandrei.vercel.app/john-andrei-martinez.jpg",
        "jobTitle": "AI/ML Engineer",
        "email": "mailto:martinezjandrei8425@gmail.com",
        "sameAs": [
          "https://github.com/Zeref538",
          "https://linkedin.com/in/john-andrei-martinez-499a0b343",
          "https://www.kaggle.com/johnandreimartinez"
        ],
        "address": { "@type": "PostalAddress", "addressLocality": "San Jose del Monte", "addressRegion": "Bulacan", "addressCountry": "PH" },
        "alumniOf": { "@type": "CollegeOrUniversity", "name": "Our Lady of Fatima University" },
        "knowsAbout": ["Machine Learning", "Data Analysis", "Computer Vision", "Retrieval-Augmented Generation", "Python", "PyTorch"]
      }
    </script>
    <!-- Loading screen: a boot log that types itself out, then lifts off the
         page like a curtain with a shallow curve. It lives here, not in React,
         so it paints before any script has downloaded. src/loader.js takes it
         down; the page's opening animation is html.intro in theme-mix.css. -->
    <script>
      // A reload used to put you back where you had scrolled to, behind the
      // loader, so the page opened mid-way. Reloads now start at the top; a
      // fresh visit to a link like /#projects still goes to that section.
      if ("scrollRestoration" in history) history.scrollRestoration = "manual";
      try {
        if (performance.getEntriesByType("navigation")[0].type === "reload" && location.hash) history.replaceState(null, "", location.pathname + location.search);
      } catch (e) {}
      try { var t = localStorage.getItem("theme"); if (t === "light") document.documentElement.dataset.theme = "light"; } catch (e) {}
      // loading pauses the hero's own animations; pre-intro hides what the
      // opening animation brings in, so nothing shows before its entrance
      document.documentElement.classList.add("loading", "pre-intro");
    </script>
    <style>
      #loader { --bg: #000; --ink: #fafaf9; --ac: #a78bfa; position: fixed; inset: 0; z-index: 9999; display: grid; place-content: center; gap: 22px;
        color: var(--ink); font: 13px/1.9 "JetBrains Mono Variable", ui-monospace, monospace; pointer-events: none; }
      /* Light: white paper, a shade brighter than the page's #f5f5f4, so the
         curtain reads as its own sheet. A purple glow smeared on paper, so the
         edge is a thin purple line and a soft grey shadow instead. */
      [data-theme="light"] #loader { --bg: #fff; --ink: #1c1917; --ac: #6d28d9; font-weight: 500; }
      [data-theme="light"] #loader::before { border-bottom: 2px solid var(--ac); box-shadow: 0 24px 50px -24px rgba(28, 25, 23, .35); }
      [data-theme="light"] #loader .dim { opacity: .6; }
      /* The backdrop is its own layer, 6vh taller than the screen, with a shallow
         curve cut into the part hanging below it, so the curve is there the
         moment it starts to lift. (Its rounded corners are exempted from the
         site's square-corner rule in theme-mix.css.) */
      #loader::before { content: ""; position: absolute; inset: 0 0 -6vh; z-index: -1; background: var(--bg);
        box-shadow: 0 30px 90px -20px color-mix(in srgb, var(--ac) 55%, transparent);
        transition: transform 1.1s cubic-bezier(.76,0,.24,1); }
      #loader.gone::before { transform: translateY(-100%); }
      /* the text is on the curtain, so it rides up with it and fades */
      #loader > * { transition: transform 1.1s cubic-bezier(.76,0,.24,1), opacity .5s ease; }
      #loader.gone > * { transform: translateY(-45vh); opacity: 0; }
      #loader .ld-log { width: min(470px, calc(100vw - 48px)); min-height: calc(7 * 1.9em); }
      #loader .ld-log div { white-space: pre; overflow: hidden; }
      #loader .ok { color: var(--ac); }
      #loader .dim { opacity: .5; }
      #loader .cur::after { content: "_"; animation: ld-blink .8s steps(1) infinite; }
      @keyframes ld-blink { 50% { opacity: 0; } }
      /* dimmed by colour, not opacity: an opacity here tied with the fade-out rule
         above and won, so the bar hung on screen after the log had gone */
      #loader .ld-bar { white-space: pre; color: color-mix(in srgb, var(--ink) 70%, var(--bg)); }
      @media (max-width: 680px) { #loader { font-size: 11px; } }
      @media (max-width: 359px) { #loader { font-size: 9.5px; } #loader .ld-log { width: calc(100vw - 20px); } }
    </style>
</head>
  <body>
    <div id="loader" aria-hidden="true">
      <div class="ld-log"></div>
      <div class="ld-bar"></div>
    </div>
    <script>
      (function () {
        var L = document.getElementById("loader"), log = L.querySelector(".ld-log"), bar = L.querySelector(".ld-bar");
        // what each line says: real facts from the site, not pretend system steps
        var lines = [
          ["loading projects", "20 built"],
          ["loading experience", "flyrank ai"],
          ["importing stack", "python · pytorch · sql"],
          ["verifying certs", "12 earned"],
          ["waking zeref-bot", "ask me anything"],
          ["status", "open to work"],
        ];
        var row = function (l) { return '<span class="ok">[ ok ]</span> ' + l[0] + ' <span class="dim">' + ".".repeat(20 - l[0].length) + "</span> " + l[1]; };
        // loader.js waits for this flag to clear before lifting the curtain
        L.dataset.hold = "1";
        var finish = function () { setTimeout(function () { delete L.dataset.hold; }, 450); };
        if (matchMedia("(prefers-reduced-motion: reduce)").matches) {
          log.innerHTML = '<div class="dim">zeref@portfolio:~$ ./boot.sh</div>' + lines.map(function (l) { return "<div>" + row(l) + "</div>"; }).join("");
          return finish();
        }
        // Fast typing: the command at 45ms a key, like a person; each line after
        // it at about 5ms a character, like a program printing. The [ ok ] tag and the
        // dotted leader appear with the finished line so the columns never jump.
        var prompt = document.createElement("div");
        prompt.className = "dim";
        prompt.innerHTML = 'zeref@portfolio:~$ <span class="cmd"></span><span class="cur"></span>';
        log.appendChild(prompt);
        var cmd = prompt.querySelector(".cmd"), text = "./boot.sh", i = 0, n = 0;
        (function typeCmd() {
          if (i < text.length) { cmd.textContent += text[i++]; return setTimeout(typeCmd, 45); }
          prompt.querySelector(".cur").remove();
          setTimeout(function nextLine() {
            if (n >= lines.length) return finish();
            var l = lines[n++], d = document.createElement("div"), full = l[0] + " " + ".".repeat(20 - l[0].length) + " " + l[1], c = 0;
            log.appendChild(d);
            (function typeLine() {
              c += 3;
              if (c < full.length) { d.innerHTML = '<span class="dim">[ .. ]</span> ' + full.slice(0, c) + '<span class="cur"></span>'; return setTimeout(typeLine, 14); }
              d.innerHTML = row(l);
              bar.textContent = "[" + "#".repeat(Math.round(n / lines.length * 20)).padEnd(20, ".") + "] " + Math.round(n / lines.length * 100) + "%";
              setTimeout(nextLine, 80);
            })();
          }, 150);
        })();
        bar.textContent = "[" + ".".repeat(20) + "] 0%";
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
